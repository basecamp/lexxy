<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Attachment controls</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .audio-preview { width: 80px; height: 60px; }
    .audio-controls { color: black; width: 100%; height: 100%; pointer-events: none; }
    .audio-controls button { pointer-events: auto; }
    .audio-progress-anchor { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; }
    .audio-progress { background: black; pointer-events: auto; }
  </style>
</head>
<body>
  <button type="button">Before editor</button>
  <lexxy-editor class="lexxy-content"></lexxy-editor>
  <button type="button">After editor</button>
  <button type="button" id="toggle-editor">Toggle editor</button>
  <script type="module" src="/attachment-controls.js"></script>
</body>
</html>
