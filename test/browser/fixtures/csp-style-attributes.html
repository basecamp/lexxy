<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="style-src-attr 'none'">
  <title>Lexxy Test — CSP without inline style attributes</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
    window.styleViolations = []
    document.addEventListener("securitypolicyviolation", (event) => {
      window.styleViolations.push(event.effectiveDirective)
    })
  </script>
  <script type="module">
    import * as Lexxy from "lexxy"
    Lexxy.configure({ global: { attachmentTagName: "bc-attachment" }})
  </script>
</head>
<body>
  <form>
    <div class="body">
      <lexxy-editor
        class="lexxy-content"
        placeholder="Write something..."
        value="<p><strong>Bold</strong> <em>italic</em> and <u>underlined</u> text</p>">
      </lexxy-editor>
    </div>
  </form>
  <script type="module" src="/editor.js"></script>
</body>
</html>
